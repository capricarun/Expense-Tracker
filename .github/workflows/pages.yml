name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in index.html config.js manifest.webmanifest sw.js icons/icon-192.png icons/icon-512.png; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          python3 -c "import json; json.load(open('manifest.webmanifest'))"

      - name: Build site folder
        run: |
          mkdir -p _site
          cp -r index.html config.js manifest.webmanifest sw.js icons _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
